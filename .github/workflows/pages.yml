# Test the game, then publish it to GitHub Pages on every push to main.
# The browser tests run as 5 parallel jobs (Android, iPhone x2, iPad x2) inside the official Playwright Docker image.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:unit   # pure Node tests, no dependencies needed

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Official Playwright image: browsers and their system libraries are preinstalled, so there is no
    # slow / variable apt install step. Keep the tag equal to the @playwright/test version in package-lock.json
    # (the "Check Playwright version" step fails with a clear message if they drift apart).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: true
      matrix:
        # WebKit is 2-3x slower than Chromium on the runners, so iPhone / iPad are split in two shards each
        # (an even split is balanced inside the Docker image).
        include:
          - { project: android, shard: 1/1 }
          - { project: iphone,  shard: 1/2 }
          - { project: iphone,  shard: 2/2 }
          - { project: ipad,    shard: 1/2 }
          - { project: ipad,    shard: 2/2 }
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Check Playwright version matches the Docker image
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          image="mcr.microsoft.com/playwright:v1.64.1-noble"   # same tag as container.image above
          echo "@playwright/test $v / $image"
          case "$image" in *"v$v-"*) ;; *) echo "::error::Update the container image tag to v$v (@playwright/test)"; exit 1;; esac
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          CI: true
          HOME: /root
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  deploy:
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (only the files the game needs)
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js css js icons _site/
          # new service worker version on every deploy, so players get the update
          sed -i "s/const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "${GITHUB_SHA::12}" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
