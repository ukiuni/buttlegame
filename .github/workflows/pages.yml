# Test the game, then publish it to GitHub Pages on every push to main.
# The browser tests run as 5 parallel jobs (Android, iPhone x2, iPad x2), each installing only the browser it needs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:unit   # pure Node tests, no dependencies needed

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # WebKit is 2-3x slower than Chromium on the runners, so iPhone / iPad are split in two shards each.
        # The heavy battle tests sit near the end of the file, so shard 1 takes more tests (65:35) to finish
        # at the same time as shard 2 (PWTEST_SHARD_WEIGHTS; if unsupported, Playwright just splits evenly).
        include:
          - { project: android, browser: chromium, shard: 1/1, weights: '' }
          - { project: iphone,  browser: webkit,   shard: 1/2, weights: '65:35' }
          - { project: iphone,  browser: webkit,   shard: 2/2, weights: '65:35' }
          - { project: ipad,    browser: webkit,   shard: 1/2, weights: '65:35' }
          - { project: ipad,    browser: webkit,   shard: 2/2, weights: '65:35' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Install browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install browser system dependencies (browser itself restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          CI: true
          PWTEST_SHARD_WEIGHTS: ${{ matrix.weights }}
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  deploy:
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site (only the files the game needs)
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js css js icons _site/
          # new service worker version on every deploy, so players get the update
          sed -i "s/const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "${GITHUB_SHA::12}" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
